# Development compose file — hot-reload for backend and frontend.
# NOT auto-loaded: only applied when explicitly passed with -f, e.g.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# (An auto-loaded docker-compose.override.yml broke prod deploys by overriding
#  the production images' CMD with pnpm dev / local builds.)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /data/aipocket:/data/aipocket
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      target: build
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
