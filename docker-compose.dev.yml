# Development overrides — auto-loaded by `docker compose up`.
# Hot-reload for both backend and frontend during development.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /data/aipocket:/data/aipocket
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      target: build
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
